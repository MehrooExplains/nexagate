services:
  nexagate:
    build: .
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - nexagate-data:/var/lib/nexagate
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  nexagate-data:
