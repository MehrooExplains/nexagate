name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          check-latest: true
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Test
        run: go test ./...
      - name: Build verified release archive
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -buildvcs=false -trimpath -ldflags "-s -w -X main.version=$version" \
            -o nexagate ./cmd/nexagate
          printf '%s\n' "$version" > VERSION
          tar -czf nexagate-linux-amd64.tar.gz nexagate VERSION
          sha256sum nexagate-linux-amd64.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          nexagate-linux-amd64.tar.gz SHA256SUMS
          --verify-tag --generate-notes --title "NexaGate $GITHUB_REF_NAME"
